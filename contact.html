<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | PhysioCare</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

  <!-- Navbar -->
  <header class="bg-white shadow">
    <div class="max-w-6xl mx-auto flex justify-between items-center p-4">
      <h1 class="text-2xl font-bold text-green-600">PhysioCare</h1>
      <button id="menu-btn" class="block md:hidden text-gray-700 focus:outline-none text-2xl">☰</button>
      <nav id="menu" class="hidden md:flex space-x-6">
        <a href="index.html" class="hover:text-green-600">Home</a>
        <a href="about.html" class="hover:text-green-600">About</a>
        <a href="services.html" class="hover:text-green-600">Services</a>
        <a href="contact.html" class="text-green-600 font-semibold">Contact</a>
      </nav>
    </div>
    <div id="mobile-menu" class="hidden flex-col space-y-2 px-4 pb-4 md:hidden">
      <a href="index.html" class="block hover:text-green-600">Home</a>
      <a href="about.html" class="block hover:text-green-600">About</a>
      <a href="services.html" class="block hover:text-green-600">Services</a>
      <a href="contact.html" class="block text-green-600 font-semibold">Contact</a>
    </div>
  </header>

  <!-- Contact Section -->
  <section class="max-w-5xl mx-auto py-12 md:py-16 px-6">
    <h2 class="text-3xl md:text-4xl font-bold text-center mb-10">Get in Touch</h2>
    
    <div class="grid gap-10 md:grid-cols-2">
      <!-- Contact Info -->
      <div>
        <h3 class="text-lg md:text-xl font-semibold mb-4">Contact Information</h3>
        <p class="mb-2">📍 123 High Street, YourTown, UK</p>
        <p class="mb-2">📞 +44 1234 567890</p>
        <p class="mb-6">📧 contact@physiocare.com</p>
        <iframe 
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3..."
          width="100%" height="250" style="border:0;" allowfullscreen loading="lazy"
          class="rounded-lg shadow"></iframe>
      </div>

      <!-- Contact Form -->
      <div>
        <h3 class="text-lg md:text-xl font-semibold mb-4">Send a Message</h3>
        <form name="contact" method="POST" data-netlify="true" class="space-y-4">
          <input type="text" name="name" placeholder="Your Name" required class="w-full p-3 border rounded-lg">
          <input type="email" name="email" placeholder="Your Email" required class="w-full p-3 border rounded-lg">
          <textarea name="message" placeholder="Your Message" rows="5" required class="w-full p-3 border rounded-lg"></textarea>
          <button type="submit" class="bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 w-full md:w-auto">
            Send Message
          </button>
        </form>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-gray-800 text-gray-300 text-center py-6 mt-8">
    <p>&copy; 2025 PhysioCare | All rights reserved.</p>
  </footer>

  <script>
    const btn = document.getElementById("menu-btn");
    const mobileMenu = document.getElementById("mobile-menu");
    btn.addEventListener("click", () => {
      mobileMenu.classList.toggle("hidden");
    });
  </script>
</body>
</html>
