<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhysioCare - Contact</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main>
    <h2>Contact Us</h2>
    <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" action="/success.html" class="contact-form">
      <input type="hidden" name="form-name" value="contact">
      <p class="hidden"><label>Don’t fill this out: <input name="bot-field"></label></p>
      <div><label>Name</label><input type="text" name="name" required></div>
      <div><label>Email</label><input type="email" name="email" required></div>
      <div><label>Message</label><textarea name="message" rows="4" required></textarea></div>
      <button type="submit">Send Message</button>
    </form>
  </main>
  <script src="/js/site.js"></script>
</body>
</html>
